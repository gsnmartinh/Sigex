name: Publicar SIGEX 2.1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-2.1.0.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: gsnmartinh/Sigex
    steps:
      - name: Descargar instalador comprobado
        uses: actions/download-artifact@v4
        with:
          name: SIGEX-exhortos-prueba
          run-id: 44394393030
          github-token: ${{ github.token }}
          path: release-files
      - name: Publicar actualización
        shell: pwsh
        run: |
          if (-not (Test-Path 'release-files/SIGEX2_Setup_2.1.0.exe')) { throw 'Falta el instalador validado.' }
          gh release view v2.1.0 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'La versión ya está publicada.'; exit 0 }
          gh release create v2.1.0 'release-files/SIGEX2_Setup_2.1.0.exe' --target d9aa342c1032f8984aebd210792cd8f223f4913b --title 'SIGEX 2.1.0' --notes 'Actualización para facilitar la tramitación de exhortos: datos reutilizables, documentos por trámite, seguimiento de licencia y reconsideración, control del archivo, historial de Word y reimpresión. Incluye mejoras de búsqueda, borradores y verificación de plantillas. Instalador comprobado mediante GitHub Actions y pruebas de los 20 modelos en formato Legal. El ORD. automático requiere activar la conexión de Google desde Ajustes.'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la actualización.' }
